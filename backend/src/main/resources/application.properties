spring.application.name=AI-Study

server.port=9876

spring.datasource.url=jdbc:postgresql://localhost:5432/ai_study

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

app.upload.dir=uploads

spring.ai.google.genai.chat.options.model=gemini-3.1-flash-lite

spring.profiles.active=local

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# JWT Configuration
jwt.secret=aistudy-secret-key-for-development-change-in-production-min-256-bits
jwt.expiration=86400000